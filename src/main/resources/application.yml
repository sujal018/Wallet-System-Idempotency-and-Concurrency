spring:
  application:
    name: wallet-system
  datasource:
    # File-based H2 so data survives restarts. LOCK_TIMEOUT = ms to wait for a row lock.
    url: jdbc:h2:file:./data/walletdb;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      # Dev convenience only. The Dockerfile turns it off for deployments.
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Seeded on first start so admin APIs can be tried. Override with ADMIN_EMAIL / ADMIN_PASSWORD in any real deployment.
  admin:
    email: ${ADMIN_EMAIL:admin@wallet.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
  jwt:
    # Base64 HMAC key (>= 256 bit). Override with the JWT_SECRET env variable in any real deployment.
    secret: ${JWT_SECRET:rBUJa14NazbxaOT1HpUbUxwmlbnYb2yv7T6ByCm9I/IEMg7FIu/lRLoA6HXjXZI/}
    expiration-ms: 3600000
